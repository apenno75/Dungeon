<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbarian Dungeon</title>
<style>
:root{--bg:#1b1713;--pn:#2a231c;--tx:#f1e6d3;--ac:#d9a441}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,serif;padding:10px}
h1{margin:0 0 8px;text-align:center;color:var(--ac)}
#app{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.panel{background:var(--pn);border:2px solid #4a3c2c;border-radius:8px;padding:10px;width:240px}
.panel h3{margin:0 0 6px;color:var(--ac);font-size:15px}
#board{display:grid;grid-template-columns:repeat(6,64px);grid-template-rows:repeat(10,64px);border:4px solid #6b5535;border-radius:6px;box-shadow:0 0 25px #000;background:#201a14}
.c{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#241d16 0 6px,#1b1611 6px 12px)}
.c i{position:absolute;display:block}
.arm,.hub{background:radial-gradient(#b9a373 1px,transparent 1.5px) 0 0/7px 7px,#cdb98a;z-index:1}
.hub{left:20px;top:20px;width:24px;height:24px}
.an{left:20px;top:0;width:24px;height:32px}.as{left:20px;bottom:0;width:24px;height:32px}
.ae{right:0;top:20px;width:32px;height:24px}.aw{left:0;top:20px;width:32px;height:24px}
.rf{inset:4px;border:3px solid #4a2e1a;border-radius:7px;background:repeating-conic-gradient(#b87a4b 0 25%,#a46a3f 0 50%) 0 0/16px 16px;z-index:2;box-shadow:inset 0 0 12px #0008}
.door{background:#5b3512;border:2px solid #f0c060;border-radius:2px;z-index:3}
.drn{top:1px;left:21px;width:22px;height:9px}.drs{bottom:1px;left:21px;width:22px;height:9px}
.dre{right:1px;top:21px;width:9px;height:22px}.drw{left:1px;top:21px;width:9px;height:22px}
.st{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;color:#1b1713;z-index:3}
.ic{font-size:30px;z-index:5;filter:drop-shadow(0 2px 2px #000)}
.hp{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;z-index:6}
.tok{position:relative;z-index:6;width:42px;height:42px;border-radius:50%;background:radial-gradient(#3b6fd6,#1e3a8a);border:3px solid #ffd24a;display:flex;align-items:center;justify-content:center;font-size:24px;animation:glow 1.2s infinite alternate}
.tok::after{content:'TU';position:absolute;top:-9px;background:#ffd24a;color:#1b1713;font:bold 9px sans-serif;padding:0 4px;border-radius:6px}
.me::before{content:'';position:absolute;inset:1px;border:3px solid #ffd24a;border-radius:8px;z-index:4;box-shadow:0 0 14px #ffd24a;pointer-events:none}
.reach{cursor:pointer}
.reach::after{content:'';position:absolute;inset:16px;border-radius:50%;border:3px solid #4ade80;background:#4ade8040;z-index:7;animation:pulse 1s infinite alternate}
.hit::after{content:'';position:absolute;inset:3px;border:3px solid #ef4444;border-radius:8px;z-index:4;box-shadow:0 0 10px #ef4444;pointer-events:none}
@keyframes pulse{to{transform:scale(1.25);opacity:.6}}
@keyframes glow{to{box-shadow:0 0 16px 4px #ffd24a}}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12px;margin-top:6px}
.legend span{display:flex;align-items:center;gap:4px}
.legend b{display:inline-block;width:16px;height:16px;border-radius:3px;border:2px solid #000}
.dice{display:flex;gap:8px;justify-content:center;margin:6px 0}
.die{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;font-weight:bold;border:2px solid #000}
.g{background:#16a34a}.r{background:#dc2626}.k{background:#111}
button{background:var(--ac);color:#1b1713;border:0;border-radius:6px;padding:7px 10px;margin:2px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#log{height:130px;overflow:auto;font-size:12px;background:#17120e;padding:5px;border-radius:5px}
#hearts{font-size:24px}
input{width:100%;padding:5px;margin-bottom:5px}
ol{padding-left:18px;margin:0;font-size:13px}
.msg{text-align:center;font-size:18px;color:var(--ac);min-height:24px}
</style>
</head>
<body>
<h1>⚔️ Barbarian Dungeon</h1>
<div id="app">
 <div class="panel">
  <h3>Il Barbaro</h3>
  <svg id="barb" viewBox="0 0 200 260" width="200" style="display:block;margin:auto;background:#3a2f24;border-radius:6px">
   <path d="M60 110 h80 v80 h-80z" fill="#8b5a2b"/><path d="M50 105 q50 -25 100 0 l-10 25 h-80z" fill="#c9c2b6"/>
   <rect x="68" y="190" width="24" height="55" fill="#5a3b1f"/><rect x="108" y="190" width="24" height="55" fill="#5a3b1f"/>
   <rect x="42" y="115" width="18" height="60" rx="8" fill="#e0ac84"/><rect x="140" y="115" width="18" height="60" rx="8" fill="#e0ac84"/>
   <circle cx="100" cy="75" r="30" fill="#e0ac84"/><path d="M68 70 q32 -50 64 0 q-32 -15 -64 0z" fill="#7a3b10"/>
   <path d="M72 95 q28 40 56 0 q-28 12 -56 0z" fill="#7a3b10"/>
   <circle cx="90" cy="75" r="3" fill="#000"/><circle cx="110" cy="75" r="3" fill="#000"/>
   <g id="sv-sword" style="display:none"><rect x="162" y="40" width="7" height="110" fill="#d4d8de"/><rect x="152" y="148" width="27" height="6" fill="#7a5a2a"/></g>
   <g id="sv-dagger" style="display:none"><rect x="163" y="100" width="6" height="45" fill="#d4d8de"/><rect x="156" y="144" width="20" height="5" fill="#7a5a2a"/></g>
   <g id="sv-shield" style="display:none"><path d="M10 110 h45 v35 q0 30 -22 40 q-23 -10 -23 -40z" fill="#3b6ea5" stroke="#d9a441" stroke-width="3"/></g>
   <g id="sv-bow" style="display:none"><path d="M165 60 q40 70 0 140" fill="none" stroke="#a0662a" stroke-width="5"/><line x1="165" y1="60" x2="165" y2="200" stroke="#ddd"/></g>
  </svg>
  <div id="hearts"></div>
  <div>💰 Monete: <b id="coins">0</b></div>
  <div>👹 Uccisi: <b id="kills">0</b> / <span id="tot"></span></div>
  <div>Turno: <b id="turn">1</b></div>
  <div id="inv" style="font-size:13px;margin-top:4px"></div>
  <div id="buffs" style="font-size:13px;color:#8fd"></div>
 </div>

 <div>
  <div class="msg" id="msg"></div>
  <div id="board"></div>
  <div class="legend"><span><b style="background:#cdb98a"></b>Corridoio</span><span><b style="background:#a46a3f"></b>Stanza</span><span><b style="background:#5b3512;border-color:#f0c060"></b>Porta</span><span><b style="background:#241d16"></b>Roccia (muro)</span><span>🧔 Tu</span><span style="color:#4ade80">● Dove puoi andare</span></div>
 </div>

 <div class="panel">
  <h3>Dadi</h3>
  <div class="dice"><div class="die g" id="dg">?</div><div class="die r" id="dr">?</div><div class="die k" id="dk">?</div></div>
  <div style="text-align:center;font-size:12px">verde: movimento · rosso: barbaro · nero: mostro</div>
  <div style="text-align:center">
   <button id="bRoll">🎲 Tira dado verde</button>
   <button id="bAtk">⚔️ Attacca</button>
   <button id="bEnd">⏭️ Fine turno</button>
  </div>
  <p style="font-size:12px">Passi: <b id="steps">0</b> (frecce o click sulle caselle verdi)</p>
  <h3>🏪 Negozio (5 monete)</h3>
  <button data-p="invis">👻 Invisibilità</button>
  <button data-p="dmg">🗡️ +2 danni</button>
  <button data-p="def">🛡️ +1 difesa</button>
  <div id="log"></div>
 </div>

 <div class="panel">
  <h3>🏆 Classifica</h3>
  <input id="name" placeholder="Il tuo nome" maxlength="20">
  <button id="bNew">🔄 Nuova partita</button>
  <ol id="lb"><li>caricamento...</li></ol>
 </div>
</div>

<script>
const SUPABASE_URL='https://erukzvrtjnvyzjvfuirn.supabase.co';
const SUPABASE_KEY='sb_publishable_FDhQ03affjzeyhCHuoKulg_Rp7PdyLM';
const W=6,H=10,DIRS={n:[0,-1,'s'],s:[0,1,'n'],e:[1,0,'w'],w:[-1,0,'e']};
const FACE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const $=id=>document.getElementById(id);
const d6=()=>1+Math.floor(Math.random()*6);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let G;

function newGame(){
  // labirinto DFS: corridoi ortogonali con curve
  const open=[...Array(H)].map(()=>[...Array(W)].map(()=>({n:0,s:0,e:0,w:0})));
  const seen=[...Array(H)].map(()=>Array(W).fill(0));
  const st=[[0,H-1]];seen[H-1][0]=1;
  while(st.length){
    const [x,y]=st[st.length-1];
    const nb=shuffle(Object.keys(DIRS)).filter(k=>{const nx=x+DIRS[k][0],ny=y+DIRS[k][1];return nx>=0&&ny>=0&&nx<W&&ny<H&&!seen[ny][nx]});
    if(!nb.length){st.pop();continue}
    const k=nb[0],nx=x+DIRS[k][0],ny=y+DIRS[k][1];
    open[y][x][k]=1;open[ny][nx][DIRS[k][2]]=1;seen[ny][nx]=1;st.push([nx,ny]);
  }
  for(let i=0;i<8;i++){ // qualche anello extra
    const x=Math.floor(Math.random()*W),y=Math.floor(Math.random()*H),k=shuffle(Object.keys(DIRS))[0];
    const nx=x+DIRS[k][0],ny=y+DIRS[k][1];
    if(nx>=0&&ny>=0&&nx<W&&ny<H){open[y][x][k]=1;open[ny][nx][DIRS[k][2]]=1}
  }
  // stanze
  const cells=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!(x===0&&y===H-1))cells.push([x,y]);
  shuffle(cells);
  const rooms=cells.slice(0,16),room={},items={},monsters=[];
  const loot=shuffle(['sword','shield','bow','dagger','c1','c1','c1','c3','c3','c1']);
  rooms.forEach(([x,y],i)=>{
    room[x+','+y]=1;
    if(i<6)monsters.push({x,y,hp:2});
    else if(i-6<loot.length)items[x+','+y]=loot[i-6];
  });
  G={open,room,items,monsters,px:0,py:H-1,hp:3,coins:0,gold:0,kills:0,total:monsters.length,
     w:{sword:0,dagger:0,bow:0,shield:0},pot:{invis:0,dmg:0,def:0},steps:0,rolled:0,attacked:0,over:0,turn:1,saved:0};
  $('log').innerHTML='';$('msg').textContent='';
  ['dg','dr','dk'].forEach(i=>$(i).textContent='?');
  log('Nuova partita! Tira il dado verde per muoverti.');
  render();
}
const log=t=>{const l=$('log');l.innerHTML+=t+'<br>';l.scrollTop=l.scrollHeight};
const mAt=(x,y)=>G.monsters.find(m=>m.x===x&&m.y===y);
const dmgB=()=>Math.max(G.w.sword?3:0,G.w.bow?2:0,G.w.dagger?1:0)+(G.pot.dmg>0?2:0);
const defB=()=>(G.w.shield?2:0)+(G.pot.def>0?1:0);
function dist(m){ // distanza in linea di vista (0 = non raggiungibile)
  const dx=m.x-G.px,dy=m.y-G.py;
  const dir=dy===0?(dx>0?'e':'w'):dx===0?(dy>0?'s':'n'):null;
  if(!dir)return 0;
  const n=Math.abs(dx)+Math.abs(dy);
  if(n===1&&G.open[G.py][G.px][dir])return 1;
  if(n===2&&G.w.bow){const mx=G.px+DIRS[dir][0],my=G.py+DIRS[dir][1];
    if(G.open[G.py][G.px][dir]&&G.open[my][mx][dir])return 2}
  return 0;
}
function adj(m){const dx=Math.abs(m.x-G.px),dy=Math.abs(m.y-G.py);if(dx+dy!==1)return 0;
  const dir=m.x>G.px?'e':m.x<G.px?'w':m.y>G.py?'s':'n';return G.open[G.py][G.px][dir]}

function combat(m,who){
  m.f=G.turn; // il mostro ha già combattuto in questo turno
  const r=d6(),b=d6();
  $('dr').textContent=FACE[r-1];$('dk').textContent=FACE[b-1];
  let t=`${who} 🔴${r} ⚫${b}: `;
  const mh=b-defB()>r,ph=r+dmgB()>b;
  if(mh){G.hp--;t+='il mostro ferisce il barbaro! '}
  if(ph){m.hp--;t+='il barbaro ferisce il mostro! '}
  if(!mh&&!ph)t+='nessun danno.';
  log(t);
  if(m.hp<=0){G.monsters=G.monsters.filter(x=>x!==m);G.coins++;G.gold++;G.kills++;log('💀 Mostro ucciso! +1 moneta');}
  if(G.hp<=0)end(false);
  else if(G.kills===G.total)end(true);
}
function end(won){
  G.over=1;$('msg').textContent=won?'🏆 HAI VINTO!':'☠️ SEI MORTO';
  saveScore(won);
}
function score(won){return G.kills*10+G.gold*2+(won?50:0)-G.turn}

function move(dir){
  if(G.over||G.steps<=0||!G.open[G.py][G.px][dir])return;
  const nx=G.px+DIRS[dir][0],ny=G.py+DIRS[dir][1];
  if(mAt(nx,ny)){log('Un mostro blocca la strada: attaccalo!');return}
  G.px=nx;G.py=ny;G.steps--;
  const k=nx+','+ny,it=G.items[k];
  if(it){
    if(it[0]==='c'){const v=+it[1];G.coins+=v;G.gold+=v;log(`💰 Trovi ${v} moneta/e d'oro`);delete G.items[k]}
    else if(it==='shield'&&G.w.bow){if(confirm('Hai l\'arco: prendere lo scudo ti fa lasciare l\'arco. Scambiare?')){G.w.bow=0;G.w.shield=1;log('🛡️ Scudo preso, arco lasciato');delete G.items[k]}}
    else if(it==='bow'&&G.w.shield){if(confirm('Hai lo scudo: prendere l\'arco ti fa lasciare lo scudo. Scambiare?')){G.w.shield=0;G.w.bow=1;log('🏹 Arco preso, scudo lasciato');delete G.items[k]}}
    else if(it==='dagger'&&G.w.sword){log('Hai già la spada, lasci il pugnale.')}
    else{G.w[it]=1;if(it==='sword')G.w.dagger=0;log('Trovi: '+{sword:'⚔️ Spada (+3 danni)',shield:'🛡️ Scudo (+2 difesa)',bow:'🏹 Arco (+2 danni, gittata 2)',dagger:'🗡️ Pugnale (+1 danni)'}[it]);delete G.items[k]}
  }
  render();checkAuto();
}
function rollMove(){
  if(G.over||G.rolled)return;
  const v=d6();G.rolled=1;G.steps=v;$('dg').textContent=FACE[v-1];log(`🟢 Dado verde: ${v} passi`);render();checkAuto();
}
function attack(){
  if(G.over||G.attacked)return;
  const ts=G.monsters.filter(m=>dist(m)).sort((a,b)=>dist(a)-dist(b));
  if(!ts.length)return;
  G.attacked=1;combat(ts[0],'Barbaro attacca:');render();checkAuto();
}
function checkAuto(){ // fine turno automatico quando non restano mosse né attacchi
  if(G.over||!G.rolled||G.pend)return;
  const canMove=G.steps>0&&Object.keys(DIRS).some(d=>G.open[G.py][G.px][d]&&!mAt(G.px+DIRS[d][0],G.py+DIRS[d][1]));
  const canAtk=!G.attacked&&G.monsters.some(dist);
  if(canMove||canAtk)return;
  G.pend=1;const t=G.turn,g=G;
  setTimeout(()=>{if(G===g&&G.pend&&G.turn===t){log('⏭️ Fine turno automatico');endTurn()}},900);
}
function bfs(m){ // prossimo passo verso il giocatore
  const q=[[m.x,m.y]],prev={};prev[m.x+','+m.y]=null;
  while(q.length){
    const [x,y]=q.shift();
    if(x===G.px&&y===G.py){let k=x+','+y,p;let path=[];while(prev[k]){path.push(k);k=prev[k]}return path.reverse()}
    for(const d in DIRS){if(!G.open[y][x][d])continue;const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=nx+','+ny;
      if(!(k in prev)){prev[k]=x+','+y;q.push([nx,ny])}}
  }
  return [];
}
function endTurn(){
  if(G.over)return;
  G.pend=0;
  if(G.pot.invis<=0){
    for(const m of [...G.monsters]){
      if(G.over)break;
      if(adj(m)){if(m.f!==G.turn)combat(m,'Mostro attacca:');continue}
      const p=bfs(m);
      if(p.length&&p.length<=6){
        const [nx,ny]=p[0].split(',').map(Number);
        if(!(nx===G.px&&ny===G.py)&&!mAt(nx,ny)){m.x=nx;m.y=ny}
      }
    }
  } else log('👻 I mostri non ti vedono.');
  if(G.over){render();return}
  for(const k in G.pot)if(G.pot[k]>0)G.pot[k]--;
  G.turn++;G.steps=0;G.rolled=0;G.attacked=0;
  log('--- Turno '+G.turn+' ---');render();
}
function buy(p){
  if(G.over||G.coins<5)return;
  G.coins-=5;G.pot[p]=2;
  log({invis:'👻 Invisibile per 2 turni',dmg:'🗡️ +2 danni per 2 turni',def:'🛡️ +1 difesa per 2 turni'}[p]);render();
}

function render(){
  const b=$('board');let h='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const o=G.open[y][x],r=!!G.room[x+','+y],m=mAt(x,y),me=x===G.px&&y===G.py;
    let inner='',cl='c',ex='';
    for(const d in DIRS)if(o[d])inner+=`<i class="arm a${d}"></i>`;
    if(r){inner+='<i class="rf"></i>';
      for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
        if(o[d]&&nx>=0&&ny>=0&&nx<W&&ny<H&&!G.room[nx+','+ny])inner+=`<i class="door dr${d}"></i>`}
    }else inner+='<i class="hub"></i>';
    if(G.steps>0&&!G.over&&!m)for(const d in DIRS)if(o[d]&&x===G.px+DIRS[d][0]&&y===G.py+DIRS[d][1]){ex=` data-d="${d}"`;cl+=' reach'}
    if(m&&dist(m))cl+=' hit';
    if(me)cl+=' me';
    if(x===0&&y===H-1&&!r)inner+='<b class="st">START</b>';
    let ct='';
    if(me)ct='<span class="tok">🧔</span>';
    else if(m)ct='<span class="ic">👹</span><span class="hp">'+'❤️'.repeat(m.hp)+'</span>';
    else if(G.items[x+','+y])ct='<span class="ic">'+{sword:'⚔️',shield:'🛡️',bow:'🏹',dagger:'🗡️',c1:'🪙',c3:'💰'}[G.items[x+','+y]]+'</span>';
    h+=`<div class="${cl}"${ex}>${inner}${ct}</div>`;
  }
  b.innerHTML=h;
  $('hearts').textContent='❤️'.repeat(Math.max(G.hp,0))+'🖤'.repeat(3-Math.max(G.hp,0));
  $('coins').textContent=G.coins;$('kills').textContent=G.kills;$('tot').textContent=G.total;
  $('turn').textContent=G.turn;$('steps').textContent=G.steps;
  const w=G.w;
  $('sv-sword').style.display=w.sword?'':'none';
  $('sv-dagger').style.display=w.dagger&&!w.sword?'':'none';
  $('sv-shield').style.display=w.shield?'':'none';
  $('sv-bow').style.display=w.bow?'':'none';
  $('inv').textContent='Equip: '+([w.sword&&'Spada +3',w.dagger&&'Pugnale +1',w.bow&&'Arco +2 (gittata 2)',w.shield&&'Scudo +2'].filter(Boolean).join(', ')||'nessuno');
  $('buffs').textContent=[G.pot.invis&&`👻 ${G.pot.invis}t`,G.pot.dmg&&`🗡️ +2 ${G.pot.dmg}t`,G.pot.def&&`🛡️ +1 ${G.pot.def}t`].filter(Boolean).join('  ');
  $('bRoll').disabled=G.over||G.rolled;
  $('bAtk').disabled=G.over||G.attacked||!G.monsters.some(dist);
  $('bEnd').disabled=G.over;
  document.querySelectorAll('[data-p]').forEach(e=>e.disabled=G.over||G.coins<5);
}

$('board').addEventListener('click',e=>{const d=e.target.closest('[data-d]');if(d)move(d.dataset.d)});
document.addEventListener('keydown',e=>{
  const k={ArrowUp:'n',ArrowDown:'s',ArrowLeft:'w',ArrowRight:'e'}[e.key];
  if(k){e.preventDefault();move(k)}
});
$('bRoll').onclick=rollMove;$('bAtk').onclick=attack;$('bEnd').onclick=endTurn;$('bNew').onclick=newGame;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>buy(b.dataset.p));

// ---------- Supabase (REST) ----------
const SBH={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
async function saveScore(won){
  if(G.saved)return;G.saved=1;
  const name=($('name').value||'Barbaro anonimo').trim();
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/scores',{method:'POST',headers:{...SBH,Prefer:'return=minimal'},
      body:JSON.stringify({name,score:score(won),gold:G.gold,kills:G.kills,turns:G.turn,won})});
    if(!r.ok)throw new Error(r.status);
    log('📤 Punteggio salvato: '+score(won));
  }catch(e){log('⚠️ Salvataggio non riuscito ('+e.message+')')}
  loadLB();
}
async function loadLB(){
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/scores?select=name,score,won&order=score.desc&limit=10',{headers:SBH});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    $('lb').innerHTML=d.length?d.map(s=>`<li>${esc(s.name)} — ${s.score} ${s.won?'🏆':''}</li>`).join(''):'<li>Nessun punteggio</li>';
  }catch(e){$('lb').innerHTML='<li>Classifica non disponibile</li>'}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
newGame();loadLB();
</script>
</body>
